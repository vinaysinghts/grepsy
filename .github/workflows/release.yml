name: Release

# Two ways to release the version in package.json:
#   - push a tag like v0.2.0 that matches it, or
#   - run this workflow from the Actions tab ("Run workflow" on main), which
#     creates the tag and the release itself, with no local machine needed.
# Either way it builds, tests, packages and publishes a GitHub Release. If the Chrome Web Store secrets are
# set, the zip is also uploaded to the store as a draft; you then submit it
# for review from the developer dashboard.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_CONFIGURED: ${{ secrets.CWS_EXTENSION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the tag and check it matches package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v$version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "Tag $tag already exists. Bump the version in package.json first." >&2
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [ "v$version" != "$tag" ]; then
              echo "Tag $tag does not match package.json version $version" >&2
              exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # When run by hand this also creates the tag on the commit that was built.
        run: gh release create "$TAG" "grepsy-$VERSION.zip" --target "$GITHUB_SHA" --title "Grepsy $TAG" --generate-notes

      - name: Upload to Chrome Web Store (draft)
        if: env.CWS_CONFIGURED == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@4.0.2 upload --source "grepsy-$VERSION.zip"
